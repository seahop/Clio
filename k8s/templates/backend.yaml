apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clio.fullname" . }}-backend
  namespace: {{ include "clio.namespace" . }}
  labels:
    {{- include "clio.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  # Recreate, not RollingUpdate: the evidence/exports/data PVCs are
  # ReadWriteOnce, so a surge pod on another node deadlocks the rollout
  # with a Multi-Attach error. Also see the cron-duplication note in
  # values.yaml before raising replicas above 1.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "clio.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clio.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        # Restart pods when config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.linkerd.enabled }}
        linkerd.io/inject: enabled
        # Skip Linkerd's outbound mTLS for database ports. Linkerd edge's
        # transport-header protocol breaks opaque TCP (Redis RESP, Postgres),
        # causing persistent ECONNRESET. Traffic stays in-cluster; the inbound
        # Linkerd proxy on each DB pod still accepts plain connections via
        # defaultInboundPolicy: all-unauthenticated.
        config.linkerd.io/skip-outbound-ports: "6379,5432"
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.backend.podSecurityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.backend.podSecurityContext.runAsNonRoot }}
        runAsUser: {{ .Values.backend.podSecurityContext.runAsUser }}
        fsGroup: {{ .Values.backend.podSecurityContext.fsGroup }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ include "clio.imageTag" (dict "root" . "image" .Values.backend.image) }}"
          imagePullPolicy: {{ include "clio.imagePullPolicy" (dict "root" . "image" .Values.backend.image) }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: clio-config
            - secretRef:
                name: clio-secrets
          volumeMounts:
            - name: evidence
              mountPath: /app/evidence
            - name: exports
              mountPath: /app/exports
            - name: data
              mountPath: /app/data
          # Startup is serial (Redis wait → DB wait → migrations → relation
          # tables); the startup probe gives it up to 2.5 minutes before
          # liveness takes over.
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
              scheme: HTTP
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
              scheme: HTTP
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: clio-evidence
        - name: exports
          persistentVolumeClaim:
            claimName: clio-exports
        - name: data
          persistentVolumeClaim:
            claimName: clio-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clio.fullname" . }}-backend
  namespace: {{ include "clio.namespace" . }}
  labels:
    {{- include "clio.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "clio.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
